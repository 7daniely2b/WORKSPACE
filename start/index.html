<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Pinguins</title>
    <!-- Conexao com o seu arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🐧 Flashcards Interativos: Pinguins</h1>

    <!-- O JavaScript vai injetar os cards aqui dentro -->
    <div class="container" id="flashcards-container"></div>

    <!-- Conexao com o seu arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #f1c40f;
            --bg: #ecf0f1;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            perspective: 1000px;
        }

        .flashcard {
            height: 350px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .front {
            background-color: var(--card-bg);
            border: 3px solid var(--primary);
            color: var(--primary);
        }

        .front .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .front h3 {
            font-size: 1.4rem;
            margin: 0;
        }

        .back {
            background-color: var(--primary);
            color: white;
            transform: rotateY(180deg);
            justify-content: space-between;
        }

        .back h2 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 10px;
        }

        .back p {
            font-size: 1.1rem;
            line-height: 1.5;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .back .detail {
            font-size: 0.9rem;
            background-color: var(--secondary);
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>🐧 Flashcards Interativos: Pinguins</h1>

    <div class="container" id="flashcards-container"></div>

    <script>
        const cardsData = [
            {
                icon: "🌍",
                question: "Onde os pinguins vivem na natureza?",
                answer: "Quase todos vivem no Hemisferio Sul.",
                detail: "Nenhum pinguim vive no Polo Norte. Habitam a Antartida, Nova Zelandia e Galapagos."
            },
            {
                icon: "🪶",
                question: "Como os pinguins se mantem secos?",
                answer: "Eles possuem penas curtas e impermeaveis.",
                detail: "Uma glandula perto da cauda produz oleo, que eles espalham pelo corpo todo."
            },
            {
                icon: "🌊",
                question: "Pinguins conseguem voar pelo ar?",
                answer: "Nao, mas eles voam sob a agua!",
                detail: "Suas asas evoluiram para nadadeiras rigidas. Algumas especies nadam a 35 km/h."
            },
            {
                icon: "👑",
                question: "Qual e a maior especie de pinguim?",
                answer: "E o Pinguim-Imperador.",
                detail: "Ele chega a ter 1,20 metros de altura e pode pesar ate 45 quilos."
            }
        ];

        const container = document.getElementById('flashcards-container');

        cardsData.forEach(data => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            
            card.innerHTML = `
                <div class="card-face front">
                    <div class="icon">${data.icon}</div>
                    <h3>${data.question}</h3>
                </div>
                <div class="card-face back">
                    <h2>Resposta!</h2>
                    <p>${data.answer}</p>
                    <div class="detail">${data.detail}</div>
                </div>
            `;

            card.addEventListener('click', () => {
                card.classList.toggle('flipped');
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
<link rel="stylesheet" href="style.css">
