<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="container">
            <!-- Cartão 1 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Onde os pinguins vivem na natureza?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>Quase todos vivem no Hemisfério Sul.</p>
                    </div>
                </div>
            </article>

            <!-- Cartão 2 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Como os pinguins se mantêm secos?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>Eles possuem penas curtas e impermeáveis.</p>
                    </div>
                </div>
            </article>

            <!-- Cartão 3 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Pinguins conseguem voar pelo ar?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>Não, mas eles voam sob a água!</p>
                    </div>
                </div>
            </article>

            <!-- Cartão 4 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Qual é a maior espécie de pinguim?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>É o Pinguim-Imperador.</p>
                    </div>
                </div>
            </article>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
