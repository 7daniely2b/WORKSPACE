<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="container">
            <!-- Cartao 1 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Onde os pinguins vivem na natureza?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>Quase todos vivem no Hemisferio Sul.</p>
                    </div>
                </div>
            </article>

            <!-- Cartao 2 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Como os pinguins se mantem secos?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>Eles possuem penas curtas e impermeaveis.</p>
                    </div>
                </div>
            </article>

            <!-- Cartao 3 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Pinguins conseguem voar pelo ar?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>Nao, mas eles voam sob a agua!</p>
                    </div>
                </div>
            </article>

            <!-- Cartao 4 -->
            <article class="cartao">
                <div class="cartao__conteudo">
                    <div class="cartao__conteudo__pergunta">
                        <p>Qual e a maior especie de pinguim?</p>
                    </div>
                    <div class="cartao__conteudo__resposta">
                        <p>E o Pinguim-Imperador.</p>
                    </div>
                </div>
            </article>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
